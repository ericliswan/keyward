[package]
name = "pwv-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the pwv password manager"

[[bin]]
name = "pwv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
pwv-core = { path = "../pwv-core" }
rpassword = "7.5.4"
secrecy = "0.10.3"
time = "0.3.55"
zeroize = "1.9.1"
zxcvbn = "3.1.1"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[features]
# Forwards pwv-core's fast test KDF so CLI tests run quickly. Never enable in a release build.
insecure-test-kdf = ["pwv-core/insecure-test-kdf"]
