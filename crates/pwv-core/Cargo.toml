[package]
name = "pwv-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Vault format, cryptography and storage for the pwv password manager"

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
rand = "0.10.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zeroize = { version = "1.9.1", features = ["serde"] }

[features]
# Lowers the default and floor KDF parameters so tests run fast. Never enable in a release build.
insecure-test-kdf = []

[dev-dependencies]
hex-literal = "1.1.0"
