[workspace]
resolver = "2"
members = ["crates/pwv-core", "crates/pwv-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ericliswan/keyward"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
